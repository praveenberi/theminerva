# Production-style stack for ONE server: HTTPS front (Caddy) -> web (nginx, static files + /api proxy) -> api -> PostgreSQL.
#
#   cp deploy/.env.production.example .env.production      # then fill it in
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#
# Only Caddy publishes ports. The database and API are reachable only inside the compose network.
name: tablely-prod

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" } # rotate, so logs cannot fill the disk

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  # One-off job: applies database migrations, then exits. The API starts only after it succeeds.
  migrate:
    image: ${API_IMAGE:-tablely-api:local}
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: "no"
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db: { condition: service_healthy }
    logging: *logging

  api:
    image: ${API_IMAGE:-tablely-api:local}
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    stop_grace_period: 30s # time to finish in-flight requests on deploy (the API drains on SIGTERM)
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      SECRETS_KEY: ${SECRETS_KEY:?set SECRETS_KEY}
      WEB_ORIGIN: ${WEB_ORIGIN:?set WEB_ORIGIN}
      PUBLIC_API_URL: ${PUBLIC_API_URL:?set PUBLIC_API_URL}
      TRUST_PROXY: ${TRUST_PROXY:-2} # Caddy + nginx are two proxies in front of the API
      RESEND_API_KEY: ${RESEND_API_KEY:?set RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM:?set EMAIL_FROM}
      DEFAULT_PLAN_CODE: ${DEFAULT_PLAN_CODE:-GROWTH}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_ID: ${WHATSAPP_PHONE_ID:-}
      WHATSAPP_TEMPLATE: ${WHATSAPP_TEMPLATE:-}
    depends_on:
      migrate: { condition: service_completed_successfully }
    logging: *logging

  web:
    image: ${WEB_IMAGE:-tablely-web:local}
    build: { context: ., dockerfile: apps/web/Dockerfile }
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    depends_on:
      api: { condition: service_healthy }
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:${HTTP_PORT:-80}"
      - "${HTTPS_PORT:-443}:${HTTPS_PORT:-443}"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      HTTP_PORT: ${HTTP_PORT:-80}
      HTTPS_PORT: ${HTTPS_PORT:-443}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates: keep this volume or you will hit Let's Encrypt rate limits
      - caddy_config:/config
    depends_on:
      web: { condition: service_healthy }
    logging: *logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:
