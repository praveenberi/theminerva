# Development / single-host production stack. Copy .env.example to .env and set real secrets first.
services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: minerva, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}", POSTGRES_DB: minerva }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U minerva"], interval: 5s, retries: 10 }
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
  api:
    build: ./server
    env_file: .env
    environment:
      DATABASE_URL: postgresql://minerva:${POSTGRES_PASSWORD}@db:5432/minerva?schema=public
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    depends_on: { db: { condition: service_healthy } }
    volumes: [uploads:/app/uploads]
  web:
    build: ./web
    ports: ["8080:80"]
    depends_on: [api]
volumes: { pgdata: {}, redisdata: {}, uploads: {} }
